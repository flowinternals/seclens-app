name: Security Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run weekly on Mondays at 00:00 UTC
    - cron: '0 0 * * 1'

jobs:
  audit:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci

    - name: Install Gitleaks
      run: |
        VERSION=8.24.3
        curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tgz
        tar -xzf gitleaks.tgz
        sudo mv gitleaks /usr/local/bin/
        rm gitleaks.tgz
        gitleaks version

    - name: Gitleaks (advisory on canary, fail on other findings)
      run: npm run secrets:scan
    
    - name: Run npm audit
      run: npm audit
      continue-on-error: true
    
    - name: Check for vulnerabilities
      run: |
        if npm audit --audit-level=moderate; then
          echo "No moderate or higher vulnerabilities found"
        else
          echo "Vulnerabilities found! Please run 'npm audit fix' or update dependencies."
          exit 1
        fi

